services:
  db:
    image: postgres:18.6-alpine3.24
    container_name: mediscan_postgres
    restart: always
    environment:
      POSTGRES_USER: mediscan_admin
      POSTGRES_PASSWORD: mediscan_P@ssw0rd
      POSTGRES_DB: mediscan_db
      PGDATA: /var/lib/postgresql/data 
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  pgdata: